name: Run unittests
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    env:
      BUILD_TYPE: ${{ matrix.build_type }}

    steps:
    - name: Clean workspace
      run: |
        echo "Cleaning up previous run"
        rm -rf "${{ github.workspace }}"
        mkdir -p "${{ github.workspace }}"

    - name: Install build GNU Arm Embedded Toolchain
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install gcc-arm-none-eabi

    - name: Checkout pico-sdk/master
      uses: actions/checkout@v4
      with:
        repository: raspberrypi/pico-sdk
        ref: master
        path: pico-sdk

    - name: Checkout pico-sdk submodules
      working-directory: ${{github.workspace}}/pico-sdk
      run: git submodule update --init

    - name: Checkout pico-vfs
      uses: actions/checkout@v4
      with:
        path: pico-vfs

    - name: Checkout pico-vfs submodules
      working-directory: ${{github.workspace}}/pico-vfs
      run: git submodule update --init --recursive

    - name: Create Build Environment
      working-directory: ${{github.workspace}}/pico-vfs
      run:  cmake -E make_directory ${{github.workspace}}/pico-vfs/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/pico-vfs/build
      run: PICO_SDK_PATH=../../pico-sdk cmake .. -DPICO_PLATFORM=host -DCMAKE_BUILD_TYPE=$BUILD_TYPE

    - name: Build
      working-directory: ${{github.workspace}}/pico-vfs/build
      shell: bash
      run: cmake --build . --target host sd_spi_tests fat_disk_tests --config $BUILD_TYPE

    - name: Test
      working-directory: ${{github.workspace}}/pico-vfs/build
      shell: bash
      run: ctest -C $BUILD_TYPE --output-on-failure

    - name: Test SD SPI and FatFs adapter with AddressSanitizer and UndefinedBehaviorSanitizer
      if: matrix.build_type == 'Debug'
      working-directory: ${{github.workspace}}/pico-vfs
      shell: bash
      env:
        UBSAN_OPTIONS: halt_on_error=1
      run: |
        cmake -S tests/sd_spi -B build/sd-spi-sanitized \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
        cmake --build build/sd-spi-sanitized --target sd_spi_tests
        ctest --test-dir build/sd-spi-sanitized --output-on-failure
        cmake -S tests/fat_disk -B build/fat-disk-sanitized \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
        cmake --build build/fat-disk-sanitized --target fat_disk_tests
        ctest --test-dir build/fat-disk-sanitized --output-on-failure
